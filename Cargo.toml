[workspace]
resolver = "2"
members = [
    "crates/psf-field-core",
    "crates/psf-field-cli",
    "crates/psf-field-corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
repository = "https://github.com/ThePletch/convolution-mapper"

[workspace.dependencies]
levenberg-marquardt = "0.15"
nalgebra = "0.34"
ndarray = { version = "0.17.2", features = ["serde"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
